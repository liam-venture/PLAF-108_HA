substitutions:
  project_name: "petlibro.af108"
  project_version: "1.0"
  motor_sensor_delay_ms: "8000"
  food_sensor_delay_ms: "10000"

esphome:
  name: plaf108
  name_add_mac_suffix: true
  project:
    name: "${project_name}"
    version: "${project_version}"
  includes: includes/std_includes.h

packages:
  home: !include .home.yaml
  base: !include .base.yaml

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

api: {}

logger:
  baud_rate: 115200
  hardware_uart: UART0
  level: DEBUG

wifi:
  ap: {}

captive_portal:

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO2
      mode: INPUT_PULLUP
    name: "GPIO2"

  - platform: gpio
    name: Battery
    pin:
      number: GPIO0
      mode:
        pullup: true
        input: true

  - platform: gpio
    name: 'Battery Plugged In'
    pin: GPIO4

  - platform: gpio
    pin:
      number: GPIO5
      inverted: true
      mode:
        pullup: true
        input: true
    name: Mains Connected

  - platform: gpio
    name: Motor Sensor
    pin:
      inverted: true
      number: GPIO8
      mode:
        pullup: true
        input: true
    on_press:
      then:
        - lambda: |
            id(present_motor_sensor_triggers) += 1;
    entity_category: DIAGNOSTIC

  - platform: gpio
    id: food_sensor
    pin:
      number: GPIO18
      mode:
        pullup: true
        input: true
    name: Food Sensor
    filters:
      - delayed_off: ${food_sensor_delay_ms}ms
    on_state:
      - script.execute: evaluate_food_sensor

  - platform: gpio
    pin:
      number: GPIO19
      inverted: true
      mode:
        pullup: true
        input: true
    name: Reset Button
    on_multi_click:
      - timing:
          - ON for at most 1s
          - OFF for at least 0.5s
        then:
          - button.press: restart_button
      - timing:
          - ON for at most 1s
          - OFF for at most 1s
          - ON for at most 1s
          - OFF for at least 0.2s
        then:
          - button.press: safemode_button
      - timing:
          - ON for at least 10s
        then:
          - button.press: reset

status_led:
  pin:
    number: GPIO3
    mode:
      output: true

switch:
  - platform: gpio
    id: motor_right
    name: 'Motor Right'
    pin:
      number: GPIO6
      mode:
        output: true
    restore_mode: ALWAYS_OFF
    interlock: &interlock_group [motor_left, motor_right]
    entity_category: DIAGNOSTIC

  - platform: gpio
    id: motor_left
    name: 'Motor Left'
    pin:
      number: GPIO7
      mode:
        output: true
    restore_mode: ALWAYS_OFF
    interlock: *interlock_group
    entity_category: DIAGNOSTIC

  - platform: gpio
    icon: mdi:alert-circle
    id: alarm_led
    name: 'Alarm'
    pin:
      number: GPIO10
      mode:
        output: true
        pulldown: true
    on_state:
      - if:
          condition:
            lambda: |
              return !x;
          then:
            - script.execute: reset_alarms

  - platform: gpio
    id: food_sensor_enable
    name: 'Enable Food Sensor'
    pin:
      number: GPIO9
      mode:
        output: true
    restore_mode: ALWAYS_ON
    on_state:
      - script.execute: evaluate_food_sensor
    entity_category: CONFIG

  - platform: template
    id: skip_next_meal
    name: "Skip Next Meal"
    icon: mdi:skip-next
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: template
    icon: mdi:alert-box-outline
    id: is_out_of_food
    name: "Out Of Food Alarm"
    optimistic: true
    on_state:
      - script.execute: evaluate_alarms

  - platform: template
    icon: mdi:alert-box-outline
    id: is_stalled
    name: "Motor Stall Alarm"
    optimistic: true
    on_state:
      - script.execute: evaluate_alarms

  - platform: template
    icon: mdi:alert-box-outline
    id: is_food_dispense_too_long
    name: "Food Dispensing Timed Out"
    optimistic: true
    on_state:
      - script.execute: evaluate_alarms

  - platform: template
    id: meal_time_1_enable
    name: "Meal Time 1 Enable"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: template
    id: meal_time_2_enable
    name: "Meal Time 2 Enable"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: template
    id: meal_time_3_enable
    name: "Meal Time 3 Enable"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: template
    id: meal_time_4_enable
    name: "Meal Time 4 Enable"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: template
    id: meal_time_5_enable
    name: "Meal Time 5 Enable"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: template
    id: meal_time_6_enable
    name: "Meal Time 6 Enable"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: template
    id: meal_time_7_enable
    name: "Meal Time 7 Enable"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: template
    id: meal_time_8_enable
    name: "Meal Time 8 Enable"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

button:
  - platform: template
    icon: mdi:hamburger
    name: "Dispense Meal"
    on_press:
      - globals.set:
          id: current_portions
          value: !lambda return (int)id(meal_size).state;
      - script.execute: dispense_food

