sensor:
  - platform: template
    name: "Meals Today"
    id: meals_today_sensor
    lambda: return id(meals_today);
    state_class: measurement
    icon: mdi:food-bowl
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    name: "Meals Total"
    id: meals_total_sensor
    lambda: return id(meals_total);
    state_class: total_increasing
    icon: mdi:food-bowl
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    name: "Last Meal Portions"
    id: last_meal_portions_sensor
    lambda: return id(current_portions);
    accuracy_decimals: 0
    icon: mdi:food-bowl
    update_interval: never

text_sensor:
  - platform: template
    name: Last Food Dispense Success
    id: last_food_dispense_success
    device_class: timestamp

  - platform: template
    name: Last Food Dispense Attempt
    id: last_food_dispense_attempt
    device_class: timestamp

globals:
  - id: present_motor_sensor_triggers
    type: int
    restore_value: no
    initial_value: "0"

  - id: last_motor_sensor_triggers
    type: int
    restore_value: no
    initial_value: "0"

  - id: motor_sensor_delay_ms
    type: int
    restore_value: no
    initial_value: "${motor_sensor_delay_ms}"

  - id: current_portions
    type: int
    restore_value: no
    initial_value: "1"

  - id: meals_today
    type: int
    restore_value: no
    initial_value: "0"

  - id: meals_total
    type: int
    restore_value: yes
    initial_value: "0"

script:
  - id: evaluate_food_sensor
    mode: single
    then:
      - if:
          condition:
            and:
              - switch.is_on: food_sensor_enable
              - binary_sensor.is_off: food_sensor
          then:
            - switch.template.publish:
                id: is_out_of_food
                state: ON
          else:
            - switch.template.publish:
                id: is_out_of_food
                state: OFF

  - id: evaluate_alarms
    mode: single
    then:
      - if:
          any:
            - switch.is_on: is_out_of_food
            - switch.is_on: is_stalled
            - switch.is_on: is_food_dispense_too_long
          then:
            - switch.turn_on: alarm_led
          else:
            - switch.turn_off: alarm_led

  - id: reset_alarms
    mode: single
    then:
      - switch.turn_off: is_out_of_food
      - switch.turn_off: is_stalled
      - switch.turn_off: is_food_dispense_too_long
      - script.execute: evaluate_alarms

  - id: watchdog_dispensing
    mode: single
    then:
      - delay: !lambda return (float)id(current_portions)*2*id(motor_sensor_delay_ms);
      - script.stop: dispense_food
      - logger.log: "Dispensing Food: Watchdog timeout!"
      - switch.turn_on: is_food_dispense_too_long
      - script.execute: evaluate_alarms

  - id: dispense_food
    mode: single
    then:
      - if:
          condition:
            switch.is_on: skip_next_meal
          then:
            - switch.turn_off: skip_next_meal
            - logger.log: "Dispensing Food: Skipped (user requested)"
            - script.stop: dispense_food
      - logger.log: "Dispensing Food: Started"
      - lambda: |
          const auto now = std::chrono::system_clock::now();
          id(last_food_dispense_attempt).publish_state(std::format("{:%FT%TZ}", now));
      - script.execute:
          id: watchdog_dispensing
      - if:
          condition:
            switch.is_on: is_stalled
          then:
            - logger.log: "Dispensing Food: Stopped (motor stalled)"
            - script.stop: watchdog_dispensing
            - script.stop: dispense_food
      - lambda: |
          id(present_motor_sensor_triggers) = 0;
          id(last_motor_sensor_triggers) = 0;
      - switch.turn_on: motor_left
      - while:
          condition:
            lambda: |
              return id(present_motor_sensor_triggers) < id(current_portions)*2;
          then:
            - wait_until:
                condition:
                  lambda: |
                    return id(present_motor_sensor_triggers) != id(last_motor_sensor_triggers);
                timeout: ${motor_sensor_delay_ms}ms
            - if:
                condition:
                  lambda: |
                    return id(present_motor_sensor_triggers) == id(last_motor_sensor_triggers);
                then:
                  - switch.turn_off: motor_left
                  - switch.turn_on: motor_right
                  - wait_until:
                      condition:
                        lambda: |
                          return id(present_motor_sensor_triggers) != id(last_motor_sensor_triggers);
                      timeout: ${motor_sensor_delay_ms}ms
                  - if:
                      condition:
                        lambda: |
                          return id(present_motor_sensor_triggers) == id(last_motor_sensor_triggers);
                      then:
                        - switch.turn_off: motor_left
                        - switch.turn_off: motor_right
                        - switch.turn_on: is_stalled
                        - script.execute: evaluate_alarms
                        - script.stop: dispense_food
                      else:
                        - lambda: |
                            id(last_motor_sensor_triggers) = id(present_motor_sensor_triggers);
                        - switch.turn_on: motor_left
                else:
                  - lambda: |
                      ESP_LOGD("logger", "Dispensing Food: %.0f%%", (id(present_motor_sensor_triggers) / ((float)id(current_portions)*2) * 100));
                  - lambda: |
                      id(last_motor_sensor_triggers) = id(present_motor_sensor_triggers);
      - switch.turn_off: motor_left
      - script.stop: watchdog_dispensing
      - lambda: |
          const auto now = std::chrono::system_clock::now();
          id(last_food_dispense_success).publish_state(std::format("{:%FT%TZ}", now));
          id(meals_today)++;
          id(meals_total)++;
      - component.update: meals_today_sensor
      - component.update: meals_total_sensor
      - component.update: last_meal_portions_sensor
      - logger.log: "Dispensing Food: Successful"